[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "escapement"
version = "1.0.0"
description = "Escapement SDK, command-line tool and MCP server: prove what your AI agent can do."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "escapement-engine",
  "httpx>=0.27",
  "mcp>=1.2",
]

[project.scripts]
escapement = "escapement.cli.main:main"
escapement-mcp = "escapement.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/escapement"]
