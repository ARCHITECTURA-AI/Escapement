line-length = 140
target-version = "py312"
extend-exclude = ["web", "**/migrations/versions/*"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008", "SIM108", "RUF001", "RUF002", "RUF003", "RUF012", "B904", "SIM105", "UP047", "UP040", "RUF005", "RUF059", "B007", "SIM102", "RUF046", "B905", "SIM110", "RUF015", "UP007"]

[lint.per-file-ignores]
"tests/**" = ["B011", "SIM117", "F811", "F401"]
