[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "escapement-api"
version = "1.0.0"
description = "The hosted Escapement arena: FastAPI gateway, run service, certificates, seasons and the Daily Room."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "escapement-engine",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "httpx>=0.27",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]

[project.scripts]
escapement-api = "escapement_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/escapement_api"]
